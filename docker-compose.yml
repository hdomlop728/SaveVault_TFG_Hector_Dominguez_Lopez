services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-savevault}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-savevault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  web:
    image: hectordl/savevault:latest
    pull_policy: always
    restart: unless-stopped
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             python manage.py loaddata fixtures/initial_data.json --ignorenonexistent || true &&
             gunicorn savevault.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    environment:
      DJANGO_SETTINGS_MODULE: savevault.settings.production
      SECRET_KEY: ${SECRET_KEY:-mi-clave-super-secreta-123-savevault-dev}
      DB_NAME: ${DB_NAME:-savevault}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-savevault.freemyip.com,localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://savevault.freemyip.com}
      SECURE_PROXY_SSL_HEADER: ${SECURE_PROXY_SSL_HEADER:-('HTTP_X_FORWARDED_PROTO', 'https')}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-hdomlop728@fp.iesromerovargas.com}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-hdomlop728@fp.iesromerovargas.com}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-ktiytncthwqriied}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-hdomlop728@fp.iesromerovargas.com}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-nd5dhq1jy4214ys2ibdzdcbplucgvr}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-4ovygy829ytfafeaklte6ab2hmccuy}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: hectordl/savevault_nginx:latest
    container_name: contenedor_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - static_files:/var/www/static
      - media_files:/var/www/media
    depends_on:
      - web
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  media_files:
  static_files:
